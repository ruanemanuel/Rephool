name: rephool_test
description: Rephool — PH identifier from smart packaging colors.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.2
  image_picker: ^1.1.2
  palette_generator: ^0.3.3
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  navigation_view: ^1.0.6
  amicons: ">1.0.0 <2.3.0-beta"
  iconly_plus: ">1.0.0 <2.3.0-beta"
  google_fonts: "8.2.1"
  flutter_inset_shadow: "2.0.3"
  camera_color_picker: ^0.0.3
  zoom_color_picker: ^1.0.2
dependency_overrides:
  camera_android_camerax: ^0.7.4+6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/rephool.png
    - assets/blankdefault.webp
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/rephool.png"